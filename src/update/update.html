<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Country Flag Fixer | 2.1.0</title>

    <link rel="icon" href="../icons/icon48.png" />
    <link rel="stylesheet" href="../css/dist.css" />
    <script src="update.js" defer></script>
  </head>

  <body class="bg-slate-50 text-slate-900">
    <main class="mx-auto max-w-3xl px-4 py-10 sm:px-8">
      <header class="mb-8 flex items-center gap-4">
        <img src="../icons/icon48.png" width="48" height="48" alt="" />
        <div>
          <h1 class="text-2xl font-bold">Country Flag Fixer</h1>
          <p class="text-slate-600" data-i18n="updateTitle"></p>
        </div>
      </header>

      <!-- Only visible localized text is replaced; markup remains in this page. -->
      <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-xs sm:p-8">
        <h2 class="mb-4 text-xl font-semibold" data-i18n="updateHeading"></h2>
        <ul class="mb-6 list-disc space-y-3 pl-5 text-slate-700">
          <li data-i18n="updateRendering"></li>
          <li data-i18n="updatePerformance"></li>
          <li data-i18n="updateControls"></li>
        </ul>

        <p class="mb-6 rounded-lg bg-blue-50 p-3 text-sm text-blue-900" data-i18n="updateReload"></p>
        <p class="mb-6 rounded-lg border border-yellow-200 bg-yellow-50 p-3 text-sm text-yellow-900" data-i18n="updateLimits"></p>

        <button id="open-settings" type="button"
          class="rounded-lg bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800"
          data-i18n="settings"></button>
        <p id="error" role="status" aria-live="polite" class="mt-3 text-sm text-red-700"></p>
      </section>
    </main>
  </body>
</html>
